<svg xmlns="http://www.w3.org/2000/svg" width="240" height="312" viewBox="0 0 240 312" role="img" aria-label="Flow evaluate">
  <title>Flow evaluate</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="240" height="312" fill="#ffffff"/>
  <text x="30" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1b2236">evaluate</text>
  <circle cx="120.0" cy="44.0" r="6" fill="#1b2236"/>
  <path d="M 120.0 50.0 L 120.0 70.0" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 120.0 116.0 L 120.0 192.0" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="126.0" y="158.0" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563" text-anchor="start">done</text>
  <g data-state="evaluate" data-kind="work">
    <rect x="30.0" y="70.0" width="180" height="46" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="120.0" y="90.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1b2236">evaluate</text>
    <text x="120.0" y="106.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1b2236">critic</text>
  </g>
  <g data-state="done" data-kind="end">
    <rect x="30.0" y="192.0" width="180" height="46" rx="8" fill="#e8f6ee" stroke="#36a86e" stroke-width="1.5"/>
    <text x="120.0" y="212.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2a7a50">done</text>
    <text x="120.0" y="228.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2a7a50">end</text>
  </g>
  <rect x="30.0" y="268.0" width="14" height="14" rx="3" fill="#ffffff" stroke="#9ca3af"/>
  <text x="50.0" y="279.0" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1b2236">work step (agent)</text>
  <rect x="180.0" y="268.0" width="14" height="14" rx="3" fill="#fdf0e7" stroke="#d06a2c"/>
  <text x="200.0" y="279.0" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a0522d">gate (human)</text>
  <rect x="330.0" y="268.0" width="14" height="14" rx="3" fill="#e8f6ee" stroke="#36a86e"/>
  <text x="350.0" y="279.0" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2a7a50">end</text>
  <path d="M 480.0 275.0 L 506.0 275.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="512.0" y="279.0" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">back to an earlier step</text>
</svg>
