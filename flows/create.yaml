name: create
description: >-
  A new LADO kit from the interview to a release tag: the supervisor interviews the human
  and writes the blueprint, the human approves it, the author writes the kit, the critic
  checks it against the budget and the rubric, the human approves the release, the
  supervisor tags it. The kit's repository is the session's repository.
start: design
states:
  design:
    agent: supervisor
    produces: [blueprint]
    do: |
      Design the kit with the human, in the chat, as your role describes (section
      "Interview in rounds"; the branches and the template are in `kit-interview`).
      1. Interview the human. Done when every requirement R1..Rn is written down and the
         human agrees with the list.
      2. Choose the shape with the human: the transferred process mapped to roles, steps and
         gates, an archetype from `kit-archetypes` as it is, several combined, or a shape of
         their own.
      3. Write `BLUEPRINT.md` with all five sections at the root of the run's worktree (its
         path is in `flow_status` for the run), draw its flow skeletons into
         `blueprint-flows/` (`kit-interview`) and commit only these on the run's branch.
         Every element of the kit traces to a requirement in section 3; the planned budget
         is in section 4.
      On a later visit revise `BLUEPRINT.md` as committed in the run's worktree, not the
      artifact or your memory: the author may have updated its section 4 since. The
      previous step's note says why you are back: the human's
      reason for rejecting it at the gate, or what the author could not build. Settle it
      with the human, then update `BLUEPRINT.md` and its diagrams and commit only these.
      Done when the blueprint answers every open question and is committed. Write the
      artifact `blueprint` from it and report `ready` as your role describes ("Artifacts
      and notes"): note_summary is the kit's name and its shape in one line.
    outcomes: {ready: design_ok}
  design_ok:
    gate: approval
    reads: [blueprint]
    ask: >-
      Approve the blueprint and its flow diagrams? The author builds the kit from them.
    outcomes: {approved: build, rejected: design}
  build:
    agent: author
    reads: [blueprint]
    produces: [build-report]
    do: |
      Write the kit from the artifact `blueprint`. After `blocked`, the previous step's
      note says what the supervisor changed in the blueprint: change what its diff on the
      run's branch changed.
    outcomes: {done: evaluate, blocked: design}
  evaluate:
    agent: critic
    max_visits: 3
    reads: [blueprint, build-report]
    produces: [evaluation]
    do: |
      Check the kit against the artifact `blueprint`.
    outcomes: {approved: release_ok, changes: build}
  release_ok:
    gate: approval
    reads: [blueprint, evaluation]
    ask: >-
      Release the kit? The supervisor sets the version, checks it, merges the run's branch
      into the branch the run started from and tags it locally.
    outcomes: {approved: release, rejected: build}
  release:
    agent: supervisor
    reads: [blueprint]
    do: |
      Release the kit as `lado-kit-format` describes ("Releasing"): 0.1.0 when the
      repository has no `v*` tag yet, unless the human wants another; otherwise the next
      version by what changed.
    outcomes: {released: done, failed: build}
  done:
    end: true
